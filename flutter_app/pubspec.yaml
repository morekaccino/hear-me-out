name: hear_me_out
description: Guitar note-reading trainer with real-time pitch feedback.
publish_to: 'none'
version: 3.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  audioplayers: ^6.8.1
  confetti: ^0.8.0
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  record: ^7.1.2
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 23
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#58CC02"
    theme_color: "#58CC02"

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/audio/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
    - family: Bravura
      fonts:
        - asset: assets/fonts/Bravura.otf
