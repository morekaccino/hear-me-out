name: hear_me_out
description: Music ear training & sight-reading platform
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  cloud_firestore: ^6.5.0
  confetti: ^0.8.0
  connectivity_plus: ^7.1.1
  fft: ^0.5.1
  firebase_analytics: ^12.4.2
  firebase_auth: ^6.5.2
  firebase_core: ^4.10.0
  firebase_messaging: ^16.3.0
  flutter:
    sdk: flutter
  flutter_audio_capture: ^1.1.12
  flutter_local_notifications: ^22.0.1
  flutter_riverpod: ^3.3.2
  freezed_annotation: ^3.1.0
  go_router: ^17.3.0
  google_fonts: ^8.1.0
  in_app_purchase: ^3.3.0
  intl: ^0.20.2
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  json_annotation: ^4.12.0
  permission_handler: ^12.0.3
  riverpod_annotation: ^4.0.3
  shimmer: ^3.0.0
  uuid: ^4.5.3

dev_dependencies:
  build_runner: ^2.15.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  mocktail: ^1.0.5
  riverpod_generator: ^4.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
