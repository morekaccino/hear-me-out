name: Flutter

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Corpus validator tests
        working-directory: .
        run: |
          dart analyze tool/corpus test/corpus_label_test.dart
          dart run test/corpus_label_test.dart
      - run: flutter pub get
      - name: Validate content fixtures
        run: |
          dart run tool/content/validate_piece.dart test/fixtures/content/valid_piece.json
          if dart run tool/content/validate_piece.dart test/fixtures/content/invalid_chord.json; then
            echo "invalid_chord.json unexpectedly passed validation" >&2
            exit 1
          fi
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release
